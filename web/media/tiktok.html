<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; base-uri 'none'; object-src 'none'; form-action 'none'; style-src 'unsafe-inline'; frame-src https://www.tiktok.com">
  <title>TikTok player</title>
  <style>
    :root{color-scheme:dark;font:16px/1.5 system-ui,sans-serif;background:#10141a;color:#eff3fa}
    *{box-sizing:border-box}body{margin:0;padding:clamp(.75rem,4vw,2rem)}
    main{max-width:35rem;margin:auto;padding:clamp(.9rem,3vw,1.5rem);background:#191f28;border:1px solid #414b5a;border-radius:1rem}
    .label{margin:0;color:#b7cefa;font-size:.75rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase}
    h1{margin:.2rem 0;font-size:clamp(1.35rem,4vw,2rem);line-height:1.2}p{margin:.55rem 0;color:#bac8d8}
    .actions{display:flex;gap:.5rem 1rem;flex-wrap:wrap;align-items:center}
    button,a{font:inherit;font-weight:650;min-height:44px}
    button{border:0;padding:.45rem .9rem;border-radius:.5rem;color:#142131;background:#c9deff;cursor:pointer}
    button:disabled{opacity:.6;cursor:default}a{align-content:center;color:#c9deff;text-underline-offset:.18em}
    :is(a,button):focus-visible{outline:2px solid #fff;outline-offset:3px}
    iframe{display:block;width:100%;height:min(60vh,36rem);min-height:15rem;border:0;border-radius:.45rem;background:#080a0d}
  </style>
</head>
<body>
  <main>
    <p class="label">Veyra media</p>
    <h1>TikTok player</h1>
    <p id="playerInfo">Loading the official player connects directly to TikTok, outside Veyra’s Fast Proxy and VPN. TikTok controls which posts are available.</p>
    <div class="actions">
      <button id="loadPlayer" type="button" hidden disabled>Load TikTok player</button>
      <button id="closePlayer" type="button" hidden>Close TikTok player</button>
      <button id="tryProxy" type="button" disabled>Use Fast Proxy</button>
      <a id="openOriginal" target="_blank" rel="noopener noreferrer" hidden>Open on TikTok</a>
    </div>
    <p id="playerStatus" role="status"></p>
    <div id="player"></div>
  </main>
</body>
</html>
