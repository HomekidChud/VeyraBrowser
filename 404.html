<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex">
  <title>Veyra Browser</title>
</head>
<body>
  <script>
    const target = new URL(location.href);
    const admin = target.pathname.match(/^(.*\/web)\/(admin(?:\/[a-z-]+)?)\/?$/);
    if (admin) {
      target.pathname = `${admin[1]}/`;
      target.searchParams.set("veyra_route", admin[2]);
      location.replace(target.href);
    } else location.replace("./web/" + location.search + location.hash);
  </script>
  <a href="./web/">Open Veyra Browser</a>
</body>
</html>
