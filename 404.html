<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex">
  <title>Veyra Browser</title>
</head>
<body>
  <script>
    const target = new URL(location.href);
    const projectRoot = target.pathname.match(/^\/VeyraBrowser(?=\/|$)/i)?.[0] || "";
    const webRoot = target.pathname.match(/^((?:\/VeyraBrowser)?\/web)(?=\/|$)/i)?.[1] || `${projectRoot}/web`;
    const prefix = target.pathname.startsWith(`${webRoot}/`) ? webRoot : projectRoot;
    const route = target.pathname.slice(prefix.length).replace(/^\/+|\/+$/g, "");
    const entry = `${webRoot}/`;
    if (target.pathname !== entry) {
      target.pathname = entry;
      if (/^(?:browse|search|calculator|downloads|history|extensions|settings|vpn|dev|admin|console|resources|links|incognito|cast|internet)(?:\/[a-z-]+)*$/.test(route)) {
        target.searchParams.set("veyra_route", route);
      }
      location.replace(target.href);
    }
  </script>
  <a href="./web/">Open Veyra Browser</a>
</body>
</html>
