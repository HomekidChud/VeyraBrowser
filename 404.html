<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex">
  <title>Veyra Browser</title>
</head>
<body>
  <script>
    const target = new URL(location.href);
    const route = target.pathname.match(/^(.*\/web)\/((?:admin|settings)(?:\/[a-z-]+)?)\/?$/);
    if (route) {
      target.pathname = `${route[1]}/`;
      target.searchParams.set("veyra_route", route[2]);
      location.replace(target.href);
    } else location.replace("./web/" + location.search + location.hash);
  </script>
  <a href="./web/">Open Veyra Browser</a>
</body>
</html>
