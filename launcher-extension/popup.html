<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Veyra Browser Launcher</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <p class="eyebrow">VEYRA BROWSER</p>
    <h1>Open a direct tab</h1>
    <p>Sign in on the official site. Your session stays in this browser and isn’t copied to Veyra.</p>
    <nav aria-label="Launch a direct tab">
      <a class="primary" href="https://www.msn.com/play" target="_blank" rel="noopener noreferrer">Open MSN Play directly <span aria-hidden="true">↗</span></a>
      <a href="https://accounts.google.com/" target="_blank" rel="noopener noreferrer">Sign in to Google <span aria-hidden="true">↗</span></a>
      <a href="https://accounts.google.com/signup" target="_blank" rel="noopener noreferrer">Create a Google account <span aria-hidden="true">↗</span></a>
      <a href="https://github.com/login" target="_blank" rel="noopener noreferrer">Sign in to GitHub <span aria-hidden="true">↗</span></a>
      <a href="https://homekidchud.github.io/VeyraBrowser/web/browse/" target="_blank" rel="noopener noreferrer">Open Veyra Browser <span aria-hidden="true">↗</span></a>
    </nav>
  </main>
</body>
</html>
