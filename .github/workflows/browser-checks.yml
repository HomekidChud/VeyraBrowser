name: Browser checks
on:
  pull_request:
    paths: ["web/**", "scripts/**", "tests/**", "package*.json", "index.html", "404.html", ".github/workflows/**"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run check
